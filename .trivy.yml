# Trivy Configuration for Snowplow Mini
# Documentation: https://aquasecurity.github.io/trivy/latest/docs/configuration/

# Scan settings
scan:
  # Security checks to enable
  security-checks:
    - vuln      # Vulnerabilities
    - config    # Misconfigurations

  # Vulnerability types to scan
  vuln-type:
    - os        # OS packages
    - library   # Application dependencies

# Severity levels to report
severity:
  - CRITICAL
  - HIGH
  - MEDIUM
  # Uncomment to include LOW and UNKNOWN
  # - LOW
  # - UNKNOWN

# Output settings
format: table

# Database settings
db:
  # Skip database update (useful for offline scans)
  skip-update: false

# Vulnerability settings
vulnerability:
  # VEX (Vulnerability Exploitability eXchange) settings
  # Uncomment if using VEX documents
  # vex: path/to/vex.json

  # Ignore unfixed vulnerabilities
  ignore-unfixed: false

# Timeout for scanning
timeout: 10m

# Cache directory
cache:
  dir: .trivycache/
