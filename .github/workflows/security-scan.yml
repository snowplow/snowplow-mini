name: Security Scanning

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  trivy-container-scan:
    name: Trivy - Container Image Scanning
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # NOTE: These versions must match provisioning/roles/docker/files/docker-compose.yml
        # When Dependabot updates docker-compose.yml, update this matrix too
        include:
          - image: opensearchproject/opensearch
            tag: 2.19.1
          - image: opensearchproject/opensearch-dashboards
            tag: 2.19.1
          - image: postgres
            tag: 16.10-alpine
          - image: snowplow/iglu-server
            tag: 0.14.0-distroless
          - image: snowplow/scala-stream-collector-nsq
            tag: 3.7.0-distroless
          - image: snowplow/snowplow-enrich-nsq
            tag: 6.1.2-distroless
          - image: snowplow/elasticsearch-loader
            tag: 2.1.3-distroless
          - image: nsqio/nsq
            tag: v1.3.0
          - image: ghcr.io/google/cadvisor
            tag: v0.53.0
          - image: swaggerapi/swagger-ui
            tag: v5.20.5
    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ matrix.image }}:${{ matrix.tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-${{ matrix.image }}'
        continue-on-error: true

      - name: Generate Human-Readable Report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ matrix.image }}:${{ matrix.tag }}'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
        continue-on-error: true

  trivy-filesystem-scan:
    name: Trivy - Filesystem Scanning
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scanner
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: 'vuln,config'
          exit-code: '0'
        continue-on-error: true

      - name: Upload Trivy filesystem results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-filesystem'
        continue-on-error: true

      - name: Generate Human-Readable Report
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          scanners: 'vuln,config'
        continue-on-error: true

  go-vulnerability-scan:
    name: Go - govulncheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        working-directory: provisioning/resources/control-plane
        run: |
          echo "## Go Vulnerability Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if govulncheck -test ./...; then
            echo "✅ No vulnerabilities found in Go dependencies" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "⚠️ Vulnerabilities found - see details above" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        continue-on-error: true

  critical-cve-check:
    name: Critical CVE Gate
    runs-on: ubuntu-24.04
    needs: [trivy-container-scan, go-vulnerability-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Check for blocking CVEs
        run: |
          echo "## 🔒 Pre-Release Security Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This job checks if any CRITICAL CVEs were found that should block release." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Review the Security tab for details before proceeding with image builds." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note**: This check does not fail the build but serves as a gate for maintainers." >> $GITHUB_STEP_SUMMARY

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-24.04
    needs: [trivy-container-scan, trivy-filesystem-scan, go-vulnerability-scan]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "# 🔒 Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All security scans have completed. Check the following:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Images**: Scanned 10 Docker images for CVEs" >> $GITHUB_STEP_SUMMARY
          echo "- **Filesystem**: Scanned for vulnerabilities and misconfigurations" >> $GITHUB_STEP_SUMMARY
          echo "- **Go Dependencies**: Checked control-plane API for known vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "- **Results**: Available in Security tab → Code scanning alerts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Runtime Security" >> $GITHUB_STEP_SUMMARY
          echo "Deployed instances include automatic security updates for Ubuntu base packages." >> $GITHUB_STEP_SUMMARY
          echo "See \`provisioning/roles/sp_mini_security_updates/\` for configuration." >> $GITHUB_STEP_SUMMARY
